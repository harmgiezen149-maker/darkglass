<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darkglass Anagram — Tone Architect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#00e5b0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Anagram" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
</head>
<body>
  <header>
    <div class="logo-group">
      <div class="logo-mark">DG</div>
      <div class="logo-text">
        <span class="logo-title">ANAGRAM</span>
        <span class="logo-sub" data-i18n="logoSub">TONE ARCHITECT</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <select id="langSelect" class="lang-select" onchange="setLanguage(this.value)">
        <option value="nl">NL</option>
        <option value="en">EN</option>
      </select>
      <div id="apiStatus" class="api-status ok" title="Anthropic API status"><span class="api-status-dot"></span> API OK</div>
      <div class="header-dots">
        <span class="dot active"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
  </header>
  <nav class="top-nav">
    <a class="nav-knop" href="/blocks.html" id="navBlokken"><span class="nav-icoon">&#9638;</span> <span data-i18n="navBlokken">BLOKKEN</span><span class="nav-badge" id="navUpdate" hidden>UPDATE</span></a>
    <a class="nav-knop nav-knop-beheer" href="/beheer.html"><span class="nav-icoon">&#9881;</span> <span data-i18n="navBeheer">BEHEER</span></a>
    <a class="nav-knop" href="/setlists.html"><span class="nav-icoon">&#9776;</span> SETLISTS</a>
  </nav>

  <main>

    <section class="panel" id="setupPanel">
      <div class="panel-label" data-i18n="panel01">01 / SETUP</div>

      <div class="field-group">
        <label class="field-label" data-i18n="bassSelectie">BASS SELECTIE</label>
        <div class="bass-selector" id="bassSelector"></div>
      </div>

      <div class="field-group">
        <label class="field-label" for="artistInput" data-i18n="artiest">ARTIEST</label>
        <input type="text" id="artistInput" class="text-input" data-i18n-placeholder="artiestPh" placeholder="bijv. Tool, Karnivool, VOLA..." />
      </div>

      <div class="field-group">
        <label class="field-label" for="songInput" data-i18n="songtitel">SONGTITEL</label>
        <input type="text" id="songInput" class="text-input" data-i18n-placeholder="songPh" placeholder="bijv. Schism, We Are, Straight Lines..." />
      </div>

      <div class="field-group">
        <label class="field-label" for="extraInput">
          <span data-i18n="extraWensen">EXTRA WENSEN</span>
          <span class="field-label-opt" data-i18n="optioneel">(optioneel)</span>
        </label>
        <textarea id="extraInput" class="text-input text-area" rows="3" data-i18n-placeholder="extraPh" placeholder="bijv: meer distortion dan het origineel, parallelle processing nodig..."></textarea>
      </div>

      <div class="field-group">
        <label class="field-label" for="aiKeuze" data-i18n="aiModel">AI-MODEL</label>
        <select id="aiKeuze" class="text-input ai-select"></select>
        <div class="ai-hint" id="aiHint"></div>
      </div>

      <label class="check-label"><input type="checkbox" id="versOnderzoek" /> <span data-i18n="versOnderzoek">Opnieuw onderzoeken (cache negeren)</span></label>

      <button class="analyze-btn" id="analyzeBtn" onclick="analyzeTone()">
        <span id="btnText" data-i18n="analyseerTone">ANALYSEER TONE</span>
        <span>&#8594;</span>
      </button>
    </section>

    <section class="panel hidden" id="outputPanel">
      <div class="panel-label" data-i18n="panel02">02 / ANAGRAM PRESET</div>
      <div class="output-meta" id="outputMeta"></div>
      <div class="scene-tabs hidden" id="sceneTabs"></div>
      <div class="output-content" id="outputContent"></div>
    </section>

    <section class="panel hidden" id="chatPanel">
      <div class="panel-label" data-i18n="panel03">03 / FINE-TUNE CHAT</div>
      <div class="scene-indicator hidden" id="sceneIndicator"></div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-row">
        <input type="text" id="chatInput" class="text-input" data-i18n-placeholder="chatPh" placeholder="Stel een vraag of geef een aanpassing..." onkeydown="if(event.key==='Enter') sendChat()" />
        <button class="send-btn" onclick="sendChat()">&#9658;</button>
      </div>
      <div class="save-row">
        <button class="save-btn" id="saveBtn" onclick="savePreset()">
          <span>&#9632;</span> <span data-i18n="presetOpslaan">PRESET OPSLAAN</span>
        </button>
        <button class="save-btn translate-btn" id="translateBtn" onclick="translatePreset()">
          <span>&#8635;</span> <span data-i18n="vertaalKnop">VERTAAL</span>
        </button>
      </div>
      <div id="presetActies" class="preset-acties"></div>
    </section>

    <section class="panel hidden" id="savedPanel">
      <div class="panel-label"><span data-i18n="panel04">04 / OPGESLAGEN PRESETS</span> <span class="saved-teller" id="savedTeller"></span></div>
      <div class="bieb-filters">
        <input type="search" id="filterZoek" class="text-input" data-i18n-placeholder="zoekPh" placeholder="Zoek op artiest, song, tag of genre..." />
        <select id="filterBas" class="text-input"></select>
        <select id="filterBeoordeling" class="text-input"></select>
        <select id="filterTag" class="text-input"></select>
      </div>
      <div class="saved-list" id="savedList"></div>
      <div class="acties-rij bieb-acties">
        <button class="actie-btn" onclick="exporteerAlles()" data-i18n="exporteerAlles">EXPORT ALLES</button>
        <label class="actie-btn" for="importInput" data-i18n="importeer">IMPORT</label>
        <input type="file" id="importInput" accept="application/json,.json" style="display:none" onchange="importeer(this)" />
      </div>
    </section>

  </main>

  <footer data-i18n="footer">DARKGLASS ANAGRAM TONE ARCHITECT &mdash; HARM'S SIGNAL CHAIN</footer>

  <!-- PWA Install Banner -->
  <div id="pwaBanner" class="pwa-banner hidden">
    <div class="pwa-banner-content">
      <div class="pwa-banner-icon">DG</div>
      <div class="pwa-banner-text">
        <div class="pwa-banner-title" data-i18n="pwaTitle">INSTALLEER ALS APP</div>
        <div class="pwa-banner-sub" data-i18n="pwaSub">Voeg toe aan je startscherm voor snelle toegang</div>
      </div>
      <div class="pwa-banner-actions">
        <button class="pwa-banner-btn pwa-install" id="pwaInstallBtn" onclick="pwaInstall()" data-i18n="pwaInstalleer">INSTALLEER</button>
        <button class="pwa-banner-btn pwa-dismiss" onclick="pwaDismiss()" data-i18n="pwaLater">LATER</button>
      </div>
    </div>
  </div>

  <script src="auth-ui.js"></script>
  <script src="shared/catalogus.js"></script>
  <script src="shared/validatie.js"></script>
  <script src="shared/preset-render.js"></script>
  <script src="shared/legacy.js"></script>
  <script src="shared/modellen.js"></script>
  <script src="shared/anagram-preset.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/util.js"></script>
  <script src="js/bibliotheek.js"></script>
  <script src="js/extra.js"></script>
  <script src="js/app.js"></script>
  <!-- Vercel Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>

  <!-- PWA Registratie -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js').catch(function(e) {
          console.warn('SW registratie mislukt:', e);
        });
      });
    }

    // Install prompt vasthouden
    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;

      // Alleen tonen als niet al gedismisst
      if (localStorage.getItem('pwa_dismissed') === '1') return;
      if (window.matchMedia('(display-mode: standalone)').matches) return; // Al geinstalleerd
      setTimeout(function() {
        var banner = document.getElementById('pwaBanner');
        if (banner) banner.classList.remove('hidden');
      }, 1500);
    });

    function pwaInstall() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choice) {
        if (choice.outcome === 'accepted') {
          document.getElementById('pwaBanner').classList.add('hidden');
        }
        deferredPrompt = null;
      });
    }

    function pwaDismiss() {
      localStorage.setItem('pwa_dismissed', '1');
      document.getElementById('pwaBanner').classList.add('hidden');
    }

    // Als geinstalleerd, banner verbergen
    window.addEventListener('appinstalled', function() {
      var b = document.getElementById('pwaBanner');
      if (b) b.classList.add('hidden');
    });
  </script>

</body>
</html>
